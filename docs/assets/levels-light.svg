<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<g opacity="1"><rect x="1" y="6" width="858" height="46" rx="9" fill="#f6f7f9" stroke="#e4e6ea"/><rect x="13" y="18" width="34" height="22" rx="5" fill="#eef0fd"/><text class="m" x="30" y="33.5" font-size="12.5" font-weight="700" fill="#3d4fd6" text-anchor="middle">L0</text><text x="60" y="34.5" font-size="15" font-weight="650" fill="#17181c">Card</text><text class="m" x="350" y="34" font-size="12" fill="#6e737d">100–300 tokens</text><text x="842" y="34.5" font-size="13.5" fill="#6e737d" text-anchor="end">what the video is about · whether to open it</text></g>
